name: GSLIB hw source recovery

on:
  push:
    branches:
      - main
    paths:
      - "src/ps2/gslib_hw_recovered.c"
      - "analysis/functions/gslib_hw_0019bd38.asm"
      - "analysis/matching/gslib_hw_listing.csv"
      - "tools/run-gslib-frontier.sh"
      - ".github/workflows/gslib-hw-source-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache EE GCC 3.2.2 stage1
        uses: actions/cache@v4
        with:
          path: build/toolchains/ee-gcc-3.2.2-stage1
          key: ee-gcc-stage1-${{ runner.os }}-${{ hashFiles('tools/bootstrap_ee_gcc_stage1.py', 'tools/fetch_ee_toolchain_recipe.py', 'tools/patches/**') }}
      - name: Build historical EE compiler
        env:
          MAKEFLAGS: MAKEINFO=true
        run: make bootstrap-ee-stage1
      - name: Prove canonical GSLIB hw corridor
        run: tools/run-gslib-frontier.sh
