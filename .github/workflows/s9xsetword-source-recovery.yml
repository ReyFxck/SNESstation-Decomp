name: S9xSetWord source recovery

on:
  push:
    branches:
      - source-recovery-file-by-file
    paths:
      - "src/snes9x/s9xsetword.cpp"
      - "tools/run-s9xsetword-source-recovery.py"
      - ".github/workflows/s9xsetword-source-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache historical EE C++ compiler
        uses: actions/cache@v4
        with:
          path: build/toolchains/ee-gcc-3.2.2-cxx-stage1
          key: ee-gxx-stage1-${{ runner.os }}-${{ hashFiles('tools/bootstrap_ee_gcc_stage1.py', 'tools/fetch_ee_toolchain_recipe.py', 'tools/patches/**') }}
          save-always: true

      - name: Build historical EE C++ compiler
        env:
          MAKEFLAGS: MAKEINFO=true
        run: make bootstrap-ee-cxx-stage1

      - name: Prove S9xSetWord target bytes
        run: python3 tools/run-s9xsetword-source-recovery.py
