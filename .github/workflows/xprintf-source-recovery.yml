name: XPRINTF C source recovery

on:
  push:
    branches:
      - source-recovery-file-by-file
    paths:
      - "matching/candidates/xprintf_recovery.c"
      - "include/xprintf_legacy_compat.h"
      - "tools/run-xprintf-source-recovery.py"
      - ".github/workflows/xprintf-source-recovery.yml"
      - "analysis/functions/ps2lib_vsnprintf_0019d84c.asm"
      - "analysis/functions/vprintf_0019faa8.asm"
      - "matching/candidates/stage3p_code_residual_exact.S"
      - "analysis/link_identity/runtime_overrides.tsv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache EE GCC 3.2.2 stage1
        uses: actions/cache@v4
        with:
          path: build/toolchains/ee-gcc-3.2.2-stage1
          key: ee-gcc-stage1-${{ runner.os }}-${{ hashFiles('tools/bootstrap_ee_gcc_stage1.py', 'tools/fetch_ee_toolchain_recipe.py', 'tools/patches/**') }}

      - name: Build historical EE compiler
        env:
          MAKEFLAGS: MAKEINFO=true
        run: make bootstrap-ee-stage1

      - name: Prove xprintf source recovery
        run: python3 tools/run-xprintf-source-recovery.py
