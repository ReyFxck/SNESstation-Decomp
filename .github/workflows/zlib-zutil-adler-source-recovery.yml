name: ZLIB 1.1.3 zutil-adler source recovery

on:
  push:
    branches: [main]
    paths:
      - "third_party/historical_refs/zlib-1.1.3/**"
      - "analysis/functions/zlib_zutil_adler_00198a84.asm"
      - "tools/run-zlib-zutil-adler-source-recovery.py"
      - ".github/workflows/zlib-zutil-adler-source-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache EE GCC 3.2.2 stage1
        uses: actions/cache@v4
        with:
          path: build/toolchains/ee-gcc-3.2.2-stage1
          key: ee-gcc-stage1-${{ runner.os }}-${{ hashFiles('tools/bootstrap_ee_gcc_stage1.py', 'tools/fetch_ee_toolchain_recipe.py', 'tools/patches/**') }}
      - name: Build historical EE compiler
        env:
          MAKEFLAGS: MAKEINFO=true
        run: make bootstrap-ee-stage1
      - name: Prove historical zutil and Adler tail
        run: python3 tools/run-zlib-zutil-adler-source-recovery.py
