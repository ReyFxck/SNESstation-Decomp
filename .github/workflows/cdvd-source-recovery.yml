name: CDVD C source recovery

on:
  push:
    branches:
      - source-recovery-file-by-file
    paths:
      - matching/candidates/cdvd_rpc.c
      - matching/ee_abi_compat/cdvd_legacy_compat.h
      - tools/run-cdvd-source-recovery.sh
      - tools/bootstrap_ee_gcc_stage1.py
      - tools/fetch_ee_toolchain_recipe.py
      - tools/patches/**
      - .github/workflows/cdvd-source-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache EE GCC 3.2.2 stage1
        uses: actions/cache@v4
        with:
          path: build/toolchains/ee-gcc-3.2.2-stage1
          key: ee-gcc-stage1-${{ runner.os }}-${{ hashFiles('tools/bootstrap_ee_gcc_stage1.py', 'tools/fetch_ee_toolchain_recipe.py', 'tools/patches/**') }}

      - name: Build historical EE compiler
        env:
          MAKEFLAGS: MAKEINFO=true
        run: make bootstrap-ee-stage1

      - name: Compare recovered CDVD C with target
        run: bash tools/run-cdvd-source-recovery.sh
