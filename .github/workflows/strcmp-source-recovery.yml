name: STRCMP assembly source recovery
on:
  push:
    branches: [source-recovery-file-by-file]
    paths:
      - "tools/run-strcmp-source-recovery.py"
      - "src/ps2/strcmp.S"
      - "analysis/functions/libkernel_libc_strings_0019c3d4.asm"
      - "analysis/link_identity/runtime_member_inputs.tsv"
      - "tools/runtime_members.py"
      - ".github/workflows/strcmp-source-recovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: build/toolchains/ee-gcc-3.2.2-stage1
          key: ee-gcc-stage1-${{ runner.os }}-${{ hashFiles('tools/bootstrap_ee_gcc_stage1.py', 'tools/fetch_ee_toolchain_recipe.py', 'tools/patches/**') }}
      - env: {MAKEFLAGS: "MAKEINFO=true"}
        run: make bootstrap-ee-stage1
      - run: python3 tools/run-strcmp-source-recovery.py
