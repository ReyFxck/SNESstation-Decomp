concurrency:
  group: source-recovery-ledger-writer-v2-${{ github.ref }}
  # Only the newest branch state can write the generated ledgers. Cancelling
  # obsolete runs prevents an older toolchain rebuild from blocking HEAD.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source-recovery-file-by-file
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore EE GCC 3.2.2
        uses: actions/cache@v4
        with:
          path: build/toolchains/ee-gcc-3.2.2-stage1
          key: ee-gcc-stage1-${{ runner.os }}-${{ hashFiles('tools/bootstrap_ee_gcc_stage1.py', 'tools/fetch_ee_toolchain_recipe.py', 'tools/patches/**') }}

      - name: Restore EE GCC 3.2.2 C++ frontend
        uses: actions/cache@v4
        with:
          path: build/toolchains/ee-gcc-3.2.2-cxx-stage1
          key: ee-gxx-stage1-${{ runner.os }}-${{ hashFiles('tools/bootstrap_ee_gcc_stage1.py', 'tools/fetch_ee_toolchain_recipe.py', 'tools/patches/**') }}
          save-always: true

      - name: Ensure historical EE compilers
        env:
          MAKEFLAGS: MAKEINFO=true
        run: |
          make bootstrap-ee-stage1
          make bootstrap-ee-cxx-stage1

      - name: Reprove exact recovered sources
        run: |
          python3 tools/run-sifcmd-source-recovery.py
          python3 tools/run-glue-source-recovery.py
          python3 tools/run-fileio-source-recovery.py
          python3 tools/run-alloc-source-recovery.py
          python3 tools/run-libkernel-leaf-source-recovery.py
          python3 tools/run-memcpy-source-recovery.py
          python3 tools/run-memset-source-recovery.py
          python3 tools/run-memmove-source-recovery.py
          python3 tools/run-strcat-source-recovery.py
          python3 tools/run-memcmp-source-recovery.py
          python3 tools/run-strcpy-source-recovery.py
          python3 tools/run-strlen-source-recovery.py
          python3 tools/run-strchr-source-recovery.py
          python3 tools/run-strcmp-source-recovery.py
          python3 tools/run-strncpy-source-recovery.py
          python3 tools/run-strncmp-source-recovery.py
          python3 tools/run-string-source-recovery.py
          python3 tools/run-strstr-source-recovery.py
          python3 tools/run-strtol-source-recovery.py
          python3 tools/run-strcasecmp-source-recovery.py
          python3 tools/run-strtok-source-recovery.py
          python3 tools/run-strncasecmp-source-recovery.py
          python3 tools/run-ctype-source-recovery.py
          python3 tools/run-qsort-source-recovery.py
          python3 tools/run-sbrk-source-recovery.py
          python3 tools/run-get-tree-source-recovery.py
          python3 tools/run-numtestf-source-recovery.py
          python3 tools/run-c4convoam-source-recovery.py
          python3 tools/run-c4doscalerotate-source-recovery.py
          python3 tools/run-c4transformlines-source-recovery.py
          python3 tools/run-c4drawwireframe-source-recovery.py
          python3 tools/run-s9xgetmempointer-source-recovery.py
          python3 tools/run-s9xsetc4-source-recovery.py
          python3 tools/run-iopheap-source-recovery.py
          python3 tools/run-loadfile-source-recovery.py
          python3 tools/run-iopcontrol-source-recovery.py
          python3 tools/run-xprintf-source-recovery.py

      - name: Refresh source ownership ledgers
        run: |
          set -eux
          EE_CC="$PWD/build/toolchains/ee-gcc-3.2.2-stage1/prefix/bin/ee-gcc"
          EE_CXX="$PWD/build/toolchains/ee-gcc-3.2.2-cxx-stage1/prefix/bin/ee-g++"
          make audit-source
          make source-tree-refresh EE_CC="$EE_CC" EE_CXX="$EE_CXX"
          make source-aliases-refresh
          make link-contracts-refresh
          make provider-frontier-refresh

      - name: Commit regenerated ownership ledgers before docs
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            analysis/source_readiness.csv \
            docs/SOURCE_COMPLETENESS.generated.md \
            analysis/source_tree/defined_symbol_ownership.tsv \
            analysis/source_tree/external_symbol_ownership.tsv \
            analysis/source_tree/object_fingerprints.tsv \
            analysis/link_identity/source_address_aliases.tsv \
            analysis/link_identity/link_contracts.tsv \
            analysis/link_identity/provider_frontier_closure.tsv
          if git diff --cached --quiet; then
            echo "No pre-doc ledger changes."
          else
            git commit -m "refresh generated source recovery ledgers"
            git pull --rebase origin source-recovery-file-by-file
            git push origin HEAD:source-recovery-file-by-file
          fi

      - name: Refresh generated docs
        run: make docs

      - name: Refresh decomp.dev public input hashes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path(".")
          path = root / "analysis/decompdev/report_contract.json"
          data = json.loads(path.read_text())
          for rel in list(data.get("inputs", {})):
              p = root / rel
              data["inputs"][rel] = hashlib.sha256(p.read_bytes()).hexdigest()
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY

      - name: Commit generated ledgers to recovery branch
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            analysis/source_readiness.csv \
            docs/SOURCE_COMPLETENESS.generated.md \
            docs/PROGRESS.generated.md \
            docs/status/PROJECT_STATUS.generated.md \
            assets/progress.svg \
            README.md \
            analysis/source_tree/defined_symbol_ownership.tsv \
            analysis/source_tree/external_symbol_ownership.tsv \
            analysis/source_tree/object_fingerprints.tsv \
            analysis/link_identity/source_address_aliases.tsv \
            analysis/link_identity/link_contracts.tsv \
            analysis/link_identity/provider_frontier_closure.tsv \
            analysis/link_identity/runtime_members.tsv \
            analysis/link_identity/runtime_member_objects.tsv \
            analysis/decompdev/report_contract.json
          if git diff --cached --quiet; then
            echo "No generated ledger changes."
          else
            git commit -m "refresh ledgers after exact source recovery"
            git pull --rebase origin source-recovery-file-by-file
            git push origin HEAD:source-recovery-file-by-file
          fi
