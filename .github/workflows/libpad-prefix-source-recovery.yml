name: LIBPAD prefix source recovery

on:
  push:
    branches: [main]
    paths:
      - "tools/run-libpad-prefix-source-recovery.py"
      - "matching/candidates/progress68/libpad-ps2lib-2004-newpadman.c.txt"
      - "analysis/functions/libpad_001a8420.asm"
      - "analysis/matching/progress68-inferred-zero-ranges.tsv"
      - ".github/workflows/libpad-prefix-source-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache EE GCC 3.2.2 stage1
        uses: actions/cache@v4
        with:
          path: build/toolchains/ee-gcc-3.2.2-stage1
          key: ee-gcc-stage1-${{ runner.os }}-${{ hashFiles('tools/bootstrap_ee_gcc_stage1.py', 'tools/fetch_ee_toolchain_recipe.py', 'tools/patches/**') }}
      - name: Build historical EE compiler
        env:
          MAKEFLAGS: MAKEINFO=true
        run: make bootstrap-ee-stage1
      - name: Prove ps2lib-era NEW_PADMAN prefix
        run: python3 tools/run-libpad-prefix-source-recovery.py
