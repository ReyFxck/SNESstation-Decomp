name: S9xGetByte historical source probe

on:
  push:
    branches:
      - source-recovery-file-by-file
    paths:
      - "tools/probe-s9xgetbyte-historical.py"
      - ".github/workflows/s9xgetbyte-historical-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract exact Snes9x 1.40 S9xGetByte source
        run: python3 tools/probe-s9xgetbyte-historical.py
