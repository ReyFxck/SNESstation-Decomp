name: C4TransformLines source recovery

on:
  push:
    branches:
      - source-recovery-file-by-file
    paths:
      - "src/ps2/c4transformlines.S"
      - "src/snes9x/c4_ps2_recovered.cpp"
      - "analysis/functions/c4transformlines_exact_772.tsv"
      - "analysis/matching/hunt1041-v81-validated-final20.tsv"
      - "tools/run-c4transformlines-source-recovery.py"
      - ".github/workflows/c4transformlines-source-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache EE GCC 3.2.2 stage1
        uses: actions/cache@v4
        with:
          path: build/toolchains/ee-gcc-3.2.2-stage1
          key: ee-gcc-stage1-${{ runner.os }}-${{ hashFiles('tools/bootstrap_ee_gcc_stage1.py', 'tools/fetch_ee_toolchain_recipe.py', 'tools/patches/**') }}

      - name: Build historical EE compiler
        env:
          MAKEFLAGS: MAKEINFO=true
        run: make bootstrap-ee-stage1

      - name: Prove exact C4TransformLines recovery
        run: python3 tools/run-c4transformlines-source-recovery.py
