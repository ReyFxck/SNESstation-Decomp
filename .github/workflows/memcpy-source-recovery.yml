name: MEMCPY assembly source recovery
# Prove the exact historical PS2LIB memcpy.S used by SNES Station.

on:
  push:
    branches:
      - source-recovery-file-by-file
    paths:
      - "tools/run-memcpy-source-recovery.py"
      - "src/ps2/memcpy.S"
      - "analysis/functions/memcpy_exact_56.tsv"
      - "analysis/link_identity/runtime_member_inputs.tsv"
      - "tools/runtime_members.py"
      - ".github/workflows/memcpy-source-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache EE GCC 3.2.2 stage1
        uses: actions/cache@v4
        with:
          path: build/toolchains/ee-gcc-3.2.2-stage1
          key: ee-gcc-stage1-${{ runner.os }}-${{ hashFiles('tools/bootstrap_ee_gcc_stage1.py', 'tools/fetch_ee_toolchain_recipe.py', 'tools/patches/**') }}

      - name: Build historical EE compiler
        env:
          MAKEFLAGS: MAKEINFO=true
        run: make bootstrap-ee-stage1

      - name: Prove historical MEMCPY assembly source
        run: python3 tools/run-memcpy-source-recovery.py
