name: C4DrawWireFrame source extract

on:
  push:
    branches:
      - source-recovery-file-by-file
    paths:
      - "tools/extract-c4draw-source.py"
      - ".github/workflows/c4draw-source-extract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract frozen Snes9x source
        run: python3 tools/extract-c4draw-source.py
