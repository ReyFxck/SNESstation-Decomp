name: STRSTR canonical flag investigation

on:
  push:
    branches:
      - source-recovery-file-by-file
    paths:
      - "tools/probe-strstr-source-tree-flags.py"
      - ".github/workflows/strstr-source-tree-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: build/toolchains/ee-gcc-3.2.2-stage1
          key: ee-gcc-stage1-${{ runner.os }}-${{ hashFiles('tools/bootstrap_ee_gcc_stage1.py', 'tools/fetch_ee_toolchain_recipe.py', 'tools/patches/**') }}
      - name: Build historical compiler
        env:
          MAKEFLAGS: MAKEINFO=true
        run: make bootstrap-ee-stage1
      - name: Compare canonical compiler flag variants
        run: python3 tools/probe-strstr-source-tree-flags.py
